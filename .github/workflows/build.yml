name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tia_version:
        description: 'TIA Openness version folder (V15_1, V16, ...)'
        required: false
        default: 'V15_1'

permissions:
  contents: write   # needed to attach the exe to a GitHub Release on tag pushes

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TIA_VERSION: ${{ github.event.inputs.tia_version || 'V15_1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # nothing to clean up afterwards

      # Unit tests need neither the Siemens DLL nor TIA Portal, so they run first.
      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test tests/TiaExportBlocks.Tests/TiaExportBlocks.Tests.csproj -c Release --logger "console;verbosity=normal" --logger "trx;LogFileName=unit-tests.trx" --logger GitHubActions --results-directory TestResults 2>&1 | Tee-Object -FilePath test-output.log
          exit $LASTEXITCODE

      # Makes failures readable through the checks API (annotations), also when the test run aborts or does not build.
      - name: Report test failures
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          $reported = 0
          if ($trx) {
            [xml]$x = Get-Content $trx.FullName
            $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
            foreach ($r in (Select-Xml -Xml $x -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns | Select-Object -First 8)) {
              $msg = ($r.Node.Output.ErrorInfo.Message + ' ' + $r.Node.Output.ErrorInfo.StackTrace) -replace "`r?`n", ' | '
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
              Write-Output "::error title=$($r.Node.testName)::$msg"
              $reported++
            }
          }
          if ($reported -eq 0 -and (Test-Path test-output.log)) {
            $lines = Get-Content test-output.log | Where-Object { $_ -match 'error|Error|aborted|crash|Exception|Failed|failed' } | Select-Object -Last 8
            foreach ($l in $lines) { Write-Output "::error title=dotnet test::$($l.Substring(0, [Math]::Min(900, $l.Length)))" }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - uses: microsoft/setup-msbuild@v2

      # Siemens.Engineering.dll is proprietary and not committed here. It lives in the private
      # repo cezar1/siemens_tia_engineering_dlls as <version, lowercase>/Siemens.Engineering.dll
      # (e.g. v15_1/, v16/) and is downloaded via the REST API with a fine-grained PAT
      # (read-only Contents on that repo) stored as secret TIA_DLLS_TOKEN.
      - name: Download Siemens.Engineering.dll
        shell: pwsh
        env:
          TIA_DLLS_TOKEN: ${{ secrets.TIA_DLLS_TOKEN }}
        run: |
          if (-not $env:TIA_DLLS_TOKEN) { Write-Error "Secret TIA_DLLS_TOKEN is not set."; exit 1 }
          $path = "$($env:TIA_VERSION.ToLower())/Siemens.Engineering.dll"
          $dest = "dll/$env:TIA_VERSION/Siemens.Engineering.dll"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          $headers = @{
            Authorization          = "Bearer $env:TIA_DLLS_TOKEN"
            Accept                 = "application/vnd.github.raw"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-WebRequest -Uri "https://api.github.com/repos/cezar1/siemens_tia_engineering_dlls/contents/$path" -Headers $headers -OutFile $dest
          Get-Item $dest | Select-Object Name, Length, @{n='Version';e={$_.VersionInfo.FileVersion}}

      - name: Build (Release)
        run: msbuild TiaExportBlocks.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:TiaVersion=${{ env.TIA_VERSION }} /m /v:minimal

      # Package only our own outputs — the Siemens DLL is deliberately left out,
      # users drop in the one matching their TIA installation (see README).
      - name: Package
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item bin/Release/TiaExportBlocks.exe, bin/Release/TiaExportBlocks.exe.config, LICENSE.txt, README.md $out
          Compress-Archive -Path "$out/*" -DestinationPath "TiaExportBlocks-$env:TIA_VERSION.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TiaExportBlocks-${{ env.TIA_VERSION }}
          path: dist/

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TiaExportBlocks-${{ env.TIA_VERSION }}.zip
